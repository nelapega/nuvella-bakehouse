<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAA64A"/>
      <stop offset="50%" stop-color="#C87A28"/>
      <stop offset="100%" stop-color="#7E4314"/>
    </linearGradient>
    <linearGradient id="crGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE8C2"/>
      <stop offset="100%" stop-color="#D98A32"/>
    </linearGradient>
    <filter id="crShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#462208" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#F4E9DC" rx="24"/>
  <ellipse cx="300" cy="270" rx="240" ry="60" fill="#E2CFBE" opacity="0.7"/>

  <!-- Main Giant Golden Croissant -->
  <g filter="url(#crShadow)" transform="translate(60, 40)">
    <!-- Back Horns -->
    <path d="M120 220 C60 170 50 110 90 90 C120 75 160 120 180 160 Z" fill="#994D14"/>
    <path d="M360 220 C420 170 430 110 390 90 C360 75 320 120 300 160 Z" fill="#994D14"/>

    <!-- Crescent Body Segments -->
    <path d="M130 190 C110 130 160 80 240 70 C320 80 370 130 350 190 C320 240 160 240 130 190 Z" fill="url(#crGrad1)"/>

    <!-- Center Flaky Rolls -->
    <ellipse cx="240" cy="150" rx="90" ry="70" fill="url(#crGrad1)"/>
    <ellipse cx="240" cy="140" rx="75" ry="55" fill="url(#crGlow)"/>
    <ellipse cx="240" cy="135" rx="60" ry="42" fill="#E28F2D"/>

    <!-- Flaky Scoring lines -->
    <path d="M175 110 C210 145 230 175 230 200" stroke="#68310B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M210 90 C235 125 250 165 250 195" stroke="#68310B" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M275 90 C265 125 260 165 260 195" stroke="#68310B" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M305 110 C290 145 280 175 280 200" stroke="#68310B" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Shiny butter highlights -->
    <path d="M200 115 C220 95 260 95 280 115" stroke="#FFF2DB" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>